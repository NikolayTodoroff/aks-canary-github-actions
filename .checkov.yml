  - CKV_AZURE_237  # Dedicated data endpoints require Premium SKU
  - CKV_AZURE_139  # Public access needed — GitHub-hosted runners push images over public internet
  - CKV_AZURE_233  # Zone redundancy requires Premium SKU, Standard chosen for cost
  - CKV_AZURE_164  # Content trust requires Premium SKU and Docker Notary setup
  - CKV_AZURE_166  # Image quarantine is a Preview feature requiring Premium SKU
  - CKV_AZURE_165  # Geo-replication requires Premium SKU, single-region sufficient for demo
  - CKV_AZURE_167  # Retention policy requires Premium SKU
  - CKV_AZURE_141  # Local admin account needed for pipeline kubectl access in demo environment
